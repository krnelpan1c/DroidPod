name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The wrapper may lose its executable bit when committed from Windows.
      - run: chmod +x gradlew
      - name: Unit tests and debug build
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: droidpod-debug
          path: app/build/outputs/apk/debug/*.apk
