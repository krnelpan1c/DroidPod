name: Release

# Push a tag like v0.1.0 to build a signed APK and attach it to a GitHub Release.
#
# Repository secrets needed:
#   DROIDPOD_KEYSTORE_BASE64   base64 of the release .jks file
#   DROIDPOD_KEYSTORE_PASSWORD
#   DROIDPOD_KEY_ALIAS
#   DROIDPOD_KEY_PASSWORD

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The wrapper may lose its executable bit when committed from Windows.
      - run: chmod +x gradlew
      - name: Decode signing key
        run: echo "${{ secrets.DROIDPOD_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed release
        env:
          DROIDPOD_KEYSTORE: ${{ runner.temp }}/release.jks
          DROIDPOD_KEYSTORE_PASSWORD: ${{ secrets.DROIDPOD_KEYSTORE_PASSWORD }}
          DROIDPOD_KEY_ALIAS: ${{ secrets.DROIDPOD_KEY_ALIAS }}
          DROIDPOD_KEY_PASSWORD: ${{ secrets.DROIDPOD_KEY_PASSWORD }}
        run: ./gradlew --console=plain testDebugUnitTest assembleRelease
      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/release/app-release.apk "DroidPod-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: DroidPod-${{ github.ref_name }}.apk
          generate_release_notes: true
